<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colors of the Sunset</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <table>
    <tr>
      <th colspan="4" class="title">
        Colors of the Sunset
      </th>
    </tr>

    <tr>
      <th class="gold">Gold</th>
      <th class="orange">Orange</th>
      <th class="crimson">Crimson</th>
      <th class="burgundy">Burgundy</th>
    </tr>

    <tr>
      <td class="gold">#FFD400</td>
      <td class="orange">#FF8400</td>
      <td class="crimson">#DC143C</td>
      <td class="burgundy">#800020</td>
    </tr>

    <tr>
      <td class="gold rgb">rgb(255, 212, 0)</td>
      <td class="orange rgb">rgb(255, 132, 0)</td>
      <td class="crimson rgb">rgb(220, 20, 60)</td>
      <td class="burgundy rgb">rgb(128, 0, 32)</td>
    </tr>

    <tr>
      <td class="gold hsl">hsl(50, 100%, 50%)</td>
      <td class="orange hsl">hsl(32, 100%, 50%)</td>
      <td class="crimson hsl">hsl(348, 83%, 47%)</td>
      <td class="burgundy hsl">hsl(343, 100%, 25%)</td>
    </tr>
  </table>
</body>
</html>
